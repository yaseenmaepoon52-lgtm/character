<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สมาชิกในกลุ่ม</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Serif+Thai:wght@500;600;700&family=Noto+Sans+Thai:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --onyx:#141110;
    --onyx-deep:#0D0B0A;
    --gold:#C9A24B;
    --gold-soft:#E4C976;
    --wine:#4A1E1E;
    --parchment:#EFE6D3;
    --parchment-dim: rgba(239,230,211,0.62);
    --line: rgba(201,162,75,0.45);
  }

  *{ box-sizing: border-box; }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  @keyframes riseIn{
    from{ opacity: 0; transform: translateY(14px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeInStagger{
    from{ opacity: 0; transform: translateY(10px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  html, body{
    margin:0;
    padding:0;
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(201,162,75,0.10), transparent 60%),
      var(--onyx-deep);
    color: var(--parchment);
    font-family: 'Noto Sans Thai', sans-serif;
  }

  .page{
    max-width: 1040px;
    margin: 0 auto;
    padding: 64px 24px 96px;
    animation: riseIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  .frame{
    border: 1px solid var(--gold);
    position: relative;
  }

  .frame::before{
    content: "";
    position: absolute;
    inset: 7px;
    border: 1px solid rgba(201,162,75,0.35);
    pointer-events: none;
  }

  .title-band{
    text-align: center;
    padding: 44px 24px 34px;
    border-bottom: 1px solid var(--gold);
  }

  .kicker{
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 17px;
    color: var(--gold-soft);
    margin: 0 0 12px;
  }

  h1{
    font-family: 'Noto Serif Thai', serif;
    font-weight: 700;
    font-size: clamp(28px, 4.4vw, 42px);
    line-height: 1.3;
    margin: 0;
    color: var(--parchment);
  }

  .columns{
    display: grid;
    grid-template-columns: repeat(3, 1fr);
  }

  .col{
    padding: 40px 32px 44px;
    text-align: center;
    border-right: 1px solid var(--line);
    animation: fadeInStagger 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    transition: background 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .col:nth-child(1){ animation-delay: 0.05s; }
  .col:nth-child(2){ animation-delay: 0.15s; }
  .col:nth-child(3){ animation-delay: 0.25s; }

  .col:hover{
    background: rgba(201,162,75,0.05);
  }

  .col:last-child{
    border-right: none;
  }

  .name{
    font-family: 'Noto Serif Thai', serif;
    font-weight: 600;
    font-size: 24px;
    color: var(--parchment);
    margin: 0 0 8px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--gold);
    display: inline-block;
  }

  .role{
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 17px;
    color: var(--gold-soft);
    margin: 0 0 28px;
  }

  .photo-frame{
    width: 100%;
    aspect-ratio: 4 / 5;
    border: 1px solid var(--gold);
    padding: 6px;
    margin: 0 0 26px;
    overflow: hidden;
    transition: box-shadow 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .photo-frame:hover{
    box-shadow: 0 0 0 6px rgba(201,162,75,0.10);
  }

  .photo{
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: linear-gradient(160deg, var(--wine), var(--onyx));
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .photo img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .photo-frame:hover img{
    transform: scale(1.045);
  }

  .photo .placeholder{
    font-family: 'Noto Serif Thai', serif;
    font-size: 20px;
    color: var(--parchment-dim);
  }

  .view-link{
    display: inline-block;
    color: var(--gold-soft);
    text-decoration: none;
    font-size: 15px;
    font-weight: 500;
    position: relative;
    padding-bottom: 4px;
    transition: color 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .view-link::after{
    content: "";
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 1px;
    background: var(--gold);
    transform: scaleX(1);
    transform-origin: left;
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .view-link:hover{
    color: var(--parchment);
  }

  .view-link:hover::after{
    transform: scaleX(1.06);
    background: var(--parchment);
  }

  .view-link:focus-visible{
    outline: 1.5px solid var(--gold-soft);
    outline-offset: 4px;
  }

  footer{
    padding-top: 40px;
    text-align: center;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 15px;
    color: rgba(239,230,211,0.4);
  }

  @media (max-width: 720px){
    .columns{
      grid-template-columns: 1fr;
    }
    .col{
      border-right: none;
      border-bottom: 1px solid var(--line);
    }
    .col:last-child{
      border-bottom: none;
    }
    .photo-frame{
      max-width: 240px;
      margin-left: auto;
      margin-right: auto;
    }
  }
</style>
</head>
<body>
  <div class="page">
    <div class="frame">

      <div class="title-band">
        <p class="kicker">Our Group</p>
        <h1>The Members</h1>
      </div>

      <div class="columns">

        <div class="col">
          <p class="name">อภิรักษ์ มุกดา</p>
          <p class="role">หัวหน้ากลุ่ม</p>
          <div class="photo-frame">
            <div class="photo">
              <img src="person1.png" alt="ชื่อสมาชิกคนที่ 1">
            </div>
          </div>
          <a class="view-link" href="person1.html">ดูข้อมูล</a>
        </div>

        <div class="col">
          <p class="name">ปิยะชาติ สุทิน</p>
          <p class="role">สมาชิก</p>
          <div class="photo-frame">
            <div class="photo">
              <img src="person2.png" alt="ชื่อสมาชิกคนที่ 2">
            </div>
          </div>
          <a class="view-link" href="person2.html">ดูข้อมูล</a>
        </div>

        <div class="col">
          <p class="name">เมธัส แม่ปุน</p>
          <p class="role">สมาชิก</p>
          <div class="photo-frame">
            <div class="photo">
              <img src="person3.png" alt="ชื่อสมาชิกคนที่ 3">
            </div>
          </div>
          <a class="view-link" href="person3.html">ดูข้อมูล</a>
        </div>

      </div>

    </div>

    <footer>
      หน้าเว็บนี้พัฒนาบนกิ่ง develop
    </footer>
  </div>
</body>
</html>
